<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img"
  aria-label="RCE が成立しても www-data 権限に限定され、root 所有・644/755・読み取り専用のソースは改ざんできないことを示すフロー図"
  font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- A: RCE -->
  <rect x="130" y="10" width="500" height="54" rx="10" fill="#e2e8f0" stroke="#94a3b8" />
  <text x="380" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">攻撃者が exec() を悪用（RCE）</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#475569">公開領域の .php 経由でコマンドを実行</text>

  <line x1="380" y1="64" x2="380" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- B: runs as www-data -->
  <rect x="130" y="94" width="500" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" />
  <text x="380" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">www-data（UID 33）として実行</text>
  <text x="380" y="138" text-anchor="middle" font-size="11.5" fill="#166534">root ではない ＝ 権限は www-data の範囲に限定</text>

  <!-- branch -->
  <line x1="380" y1="152" x2="380" y2="172" stroke="#64748b" stroke-width="2" />
  <line x1="200" y1="172" x2="560" y2="172" stroke="#64748b" stroke-width="2" />
  <line x1="200" y1="172" x2="200" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="560" y1="172" x2="560" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- C: can do -->
  <rect x="40" y="198" width="320" height="176" rx="10" fill="#fef3c7" stroke="#f59e0b" />
  <text x="60" y="224" font-size="13.5" font-weight="700" fill="#713f12">△ できてしまう</text>
  <text x="60" y="250" font-size="11.5" fill="#854d0e">・ファイルの読み取り</text>
  <text x="60" y="270" font-size="11.5" fill="#854d0e">・ls / id などの実行</text>
  <text x="60" y="290" font-size="11.5" fill="#854d0e">・www-data が読める範囲の</text>
  <text x="60" y="306" font-size="11.5" fill="#854d0e">　情報の閲覧</text>
  <text x="60" y="334" font-size="11" fill="#a16207">（読み取り権 r があるため。</text>
  <text x="60" y="350" font-size="11" fill="#a16207">　被害はここまで）</text>

  <!-- D: cannot do -->
  <rect x="400" y="198" width="320" height="176" rx="10" fill="#ffe4e6" stroke="#f43f5e" />
  <text x="420" y="224" font-size="13.5" font-weight="700" fill="#881337">✕ できない（守られる）</text>
  <text x="420" y="250" font-size="11.5" fill="#9f1239">・ソースの改ざん / バックドア設置</text>
  <text x="420" y="278" font-size="11" font-weight="700" fill="#9f1239">理由：</text>
  <text x="420" y="296" font-size="11" fill="#9f1239">・ソースは root:root 所有</text>
  <text x="420" y="314" font-size="11" fill="#9f1239">・ファイル 644 / ディレクトリ 755</text>
  <text x="420" y="330" font-size="11" fill="#9f1239">　→ その他(www-data)は読み取りのみ</text>
  <text x="420" y="348" font-size="11" fill="#9f1239">・Nginx のマウントは :ro（読み取り専用）</text>
</svg>
