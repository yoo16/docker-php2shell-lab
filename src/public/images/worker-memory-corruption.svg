<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="system-ui, sans-serif">
  <title>ワーカーのメモリ破壊と誤実行のイメージ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569" />
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#be123c" />
    </marker>
  </defs>

  <!-- ① 正常 -->
  <text x="20" y="22" font-size="13" font-weight="700" fill="#065f46">① 正常: 入力がバッファに収まる</text>
  <rect x="20" y="34" width="190" height="34" rx="4" fill="#d1fae5" stroke="#10b981" />
  <text x="115" y="56" font-size="12" text-anchor="middle" fill="#064e3b">入力バッファ</text>
  <rect x="20" y="68" width="190" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="115" y="90" font-size="12" text-anchor="middle" fill="#334155">隣接データ</text>
  <rect x="20" y="102" width="190" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6" />
  <text x="115" y="124" font-size="12" text-anchor="middle" fill="#1e3a8a">戻りアドレス / 関数ポインタ</text>
  <path d="M225 119 H262" stroke="#475569" stroke-width="2" marker-end="url(#ar)" />
  <rect x="268" y="102" width="130" height="34" rx="4" fill="#fff" stroke="#10b981" stroke-dasharray="4 3" />
  <text x="333" y="124" font-size="12" text-anchor="middle" fill="#064e3b">正規の処理へ戻る</text>

  <!-- ② 破壊 -->
  <text x="20" y="176" font-size="13" font-weight="700" fill="#9f1239">② 脆弱性: 範囲外まで書き込まれる(メモリ破壊)</text>
  <path d="M40 186 V218" stroke="#be123c" stroke-width="2" marker-end="url(#ar-r)" />
  <text x="52" y="206" font-size="11" fill="#be123c">細工した入力</text>
  <rect x="20" y="222" width="190" height="34" rx="4" fill="#fecdd3" stroke="#e11d48" />
  <text x="115" y="244" font-size="12" text-anchor="middle" fill="#881337">入力バッファ(あふれる)</text>
  <rect x="20" y="256" width="190" height="34" rx="4" fill="#fecdd3" stroke="#e11d48" />
  <text x="115" y="278" font-size="12" text-anchor="middle" fill="#881337">隣接データ(上書き)</text>
  <rect x="20" y="290" width="190" height="34" rx="4" fill="#fecdd3" stroke="#e11d48" stroke-width="2" />
  <text x="115" y="312" font-size="12" text-anchor="middle" fill="#881337" font-weight="700">戻りアドレス(上書き)</text>

  <!-- 分岐 -->
  <path d="M225 307 C270 307 280 264 330 264" fill="none" stroke="#be123c" stroke-width="2" marker-end="url(#ar-r)" />
  <path d="M225 307 C270 307 280 340 330 340" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-r)" />

  <rect x="336" y="242" width="190" height="44" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
  <text x="431" y="262" font-size="12" text-anchor="middle" fill="#881337" font-weight="700">不正なアドレスへジャンプ</text>
  <text x="431" y="278" font-size="11" text-anchor="middle" fill="#881337">→ SIGSEGV 等でワーカー異常終了</text>
  <rect x="336" y="318" width="190" height="44" rx="6" fill="#fff" stroke="#e11d48" stroke-dasharray="5 4" />
  <text x="431" y="338" font-size="12" text-anchor="middle" fill="#881337" font-weight="700">攻撃者が選んだコードを実行</text>
  <text x="431" y="354" font-size="11" text-anchor="middle" fill="#881337">→ RCE（条件が揃った場合のみ）</text>

  <!-- 結果 -->
  <path d="M530 264 H560" stroke="#475569" stroke-width="2" marker-end="url(#ar)" />
  <rect x="566" y="230" width="176" height="68" rx="6" fill="#fef3c7" stroke="#f59e0b" />
  <text x="654" y="252" font-size="12" text-anchor="middle" fill="#78350f" font-weight="700">✔ 今回ここまで観測</text>
  <text x="654" y="270" font-size="11" text-anchor="middle" fill="#78350f">exited with code 70</text>
  <text x="654" y="286" font-size="11" text-anchor="middle" fill="#78350f">親が新ワーカーを起動</text>
  <path d="M530 340 H560" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)" />
  <rect x="566" y="318" width="176" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4" />
  <text x="654" y="338" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">✘ 未確認</text>
  <text x="654" y="354" font-size="11" text-anchor="middle" fill="#475569">任意コード実行の証拠なし</text>
</svg>
