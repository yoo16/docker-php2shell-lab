server {
    listen 80;
    # サーバーのバージョン情報を非表示にする
    server_tokens off;
    # データのアップロードサイズ制限
    client_max_body_size 2m;
    # ドキュメントルートを public ディレクトリに指定
    root /var/www/html/public;
    # ドキュメントルートが /var/www/html になると、PHP では危険な設定になる可能性
    # root /var/www/html;
    index index.php, index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # try_files $uri $uri/ /index.php?$query_string;
    }

    # TODO: .env ファイルや .git ディレクトリなどの隠しファイルへのアクセスを拒否
    # location ~ /\.(?!well-known(?:/|$)) {
    #     deny all;
    # }

    # TODO: PHP として実行するのは index.php のみ
    # location = /index.php {
    #     fastcgi_pass php:9000;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    # }

    # この設定だと、任意の PHP ファイルも実行されてしまう可能性があるため危険
    # TODO: これをコメントアウトし、上記の index.php のみを実行する設定を有効にする
    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # TODO: 任意の PHP ファイルが実行されてしまう可能性があるため危険
    # アクセス拒否(404 Not Found) にする
    # location ~ \.php$ {
    #     return 404;
    # }
}
