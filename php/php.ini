; セキュリティ教材用 php.ini (conf.d に追加読み込みされる)

[PHP]
; TODO: レスポンスヘッダ X-Powered-By に PHP のバージョン: On の場合は表示される
expose_php = On

; TODO: 教材の初期状態ではエラーを画面に表示する（情報露出の穴）: On の場合は表示される
display_errors = On
display_startup_errors = Off
; エラーをログに出力する。これはサーバーログを残すためには必要
log_errors = On
error_log = /proc/self/fd/2
; エラーログレベル: E_ALL の場合は全てのエラーをログに出力する 
error_reporting = E_ALL

; ファイルアクセス・外部読み込みの制限
allow_url_fopen = Off
; TODO: allow_url_fopen が On の場合は URL 経由のファイルアクセスが許可されるので危険
allow_url_include = On

; open_basedir で指定されたディレクトリ以外へのファイルアクセスを制限する
open_basedir = /var/www/html:/tmp

; TODO: 利用できない関数を制限することで、シェル実行や環境操作などの危険な操作を防ぐ
; 教材の初期状態では危険な関数の制限は無効化している
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file,dl,symlink,link,putenv

; ストリーム関連
default_socket_timeout = 5
auto_detect_line_endings = Off
; phar ストリームラッパー経由の自動デシリアライズ対策
phar.readonly = On
phar.require_hash = On

; アップロード(デフォルトは無効。教材で使う時だけ On にする)
file_uploads = On
; アップロード用の一時ディレクトリ
upload_tmp_dir = /tmp
; アップロードファイルの最大サイズ
upload_max_filesize = 1M
; アップロードファイルの最大数
max_file_uploads = 1
; POST データの最大サイズ
post_max_size = 2M

; POST データの最大数
max_input_vars = 1000
; 入力の最大サイズ
max_input_time = 10
; メモリ制限
memory_limit = 128M
; スクリプトの最大実行時間
max_execution_time = 10

[Session]
; strict モードを有効にする
session.use_strict_mode = 1
; Cookie のみを使用する
session.use_only_cookies = 1
; HTTP Only 属性を有効にする
session.cookie_httponly = 1
; SameSite 属性を設定する
session.cookie_samesite = Lax
; アップロード進捗用のセッションデータを作らない(アップロード経由のセッション悪用対策)
session.upload_progress.enabled = Off
; HTTPS で配信する場合は 1 にする
session.cookie_secure = 0

[Date]
date.timezone = Asia/Tokyo
